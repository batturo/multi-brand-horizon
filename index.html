<style>
/* Layout: a local shop's site. Real banner up top, a plain info strip, a store directory, then the shelves. Montserrat only for the logo. */
:root{
  --bg:#f7f4ee; --surface:#ffffff; --sunk:#efeae0; --ink:#17191a; --muted:#5f5a52; --line:#e3ddd1; --line-strong:#17191a;
  --gold:#80591a; --gold-hi:#c4974a; --gold-soft:#f3e9d6;
  --panel:#17191a; --on-panel:#f1ece3; --on-panel-muted:#aaa397;
  --ok:#2f6b45; --ok-bg:#e3efe5; --warn:#a03b28; --warn-bg:#f8e4de;
  --logo:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:4px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111312; --surface:#191c1b; --sunk:#202423; --ink:#ede8de; --muted:#a39c90; --line:#2c302e; --line-strong:#ede8de;
  --gold:#d8b06a; --gold-hi:#e3bd78; --gold-soft:#2b2619;
  --panel:#0a0b0b; --on-panel:#ede8de; --on-panel-muted:#9b9488;
  --ok:#8fcfa2; --ok-bg:#17291f; --warn:#f0a593; --warn-bg:#3a1e18; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#111312; --surface:#191c1b; --sunk:#202423; --ink:#ede8de; --muted:#a39c90; --line:#2c302e; --line-strong:#ede8de;
  --gold:#d8b06a; --gold-hi:#e3bd78; --gold-soft:#2b2619;
  --panel:#0a0b0b; --on-panel:#ede8de; --on-panel-muted:#9b9488;
  --ok:#8fcfa2; --ok-bg:#17291f; --warn:#f0a593; --warn-bg:#3a1e18; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:inherit}
h1,h2,h3{font-family:var(--body);font-weight:700;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:42px;padding:0 1rem;border-radius:var(--r);border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:600;font-size:.95rem;text-decoration:none;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.btn:hover{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);color:var(--ink)}
.btn.small{min-height:34px;padding:0 .75rem;font-size:.87rem}
.btn.danger{background:var(--warn);border-color:var(--warn);color:var(--bg)}
.btn[disabled]{opacity:.55;cursor:progress}
.linkbtn{background:none;border:0;padding:0;color:var(--gold);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* Announcement + header */
.announce{background:var(--gold);color:var(--bg);font-size:.9rem;font-weight:500;text-align:center}
.announce .wrap{padding-block:.45rem}
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:1.25rem;padding-block:.7rem}
.logo{display:flex;flex-direction:column;text-decoration:none;font-family:var(--logo);font-weight:900;text-transform:uppercase;line-height:.9;letter-spacing:-.01em;flex:none}
.logo .l1{font-size:.92rem}
.logo .l2{font-size:1.32rem;color:var(--gold)}
.hsearch{flex:1;max-width:520px;display:flex;align-items:center;gap:.5rem;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:0 .75rem;min-height:42px;color:var(--muted)}
.hsearch:focus-within{border-color:var(--ink)}
.hsearch input{flex:1;min-width:0;border:0;background:transparent;outline:none;color:var(--ink)}
.nav{display:flex;align-items:center;gap:.15rem;margin-left:auto}
.nav a{display:inline-flex;align-items:center;gap:.4rem;min-height:40px;padding:0 .65rem;border-radius:var(--r);text-decoration:none;font-weight:500;font-size:.93rem}
.nav a:hover{background:var(--sunk)}
.nav a.on{color:var(--gold)}
.nav .only-sm{display:none}
@media (max-width:760px){ .hsearch{display:none} .nav .only-sm{display:inline-flex} }
@media (max-width:560px){ .nav .lbl{display:none} .nav a{padding:0 .55rem} }
.catrail .wrap{display:flex;gap:1.5rem;overflow-x:auto;scrollbar-width:none}
.catrail .wrap::-webkit-scrollbar{display:none}
.catrail a{display:inline-flex;align-items:center;white-space:nowrap;min-height:44px;text-decoration:none;font-weight:500;font-size:.93rem;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.catrail a:hover{color:var(--ink)}
.catrail a.on{color:var(--ink);border-bottom-color:var(--gold-hi)}

/* Home: banner + info strip */
.home-top{padding-block:1.25rem 0}
.banner{display:block;width:100%;max-width:100%;height:auto;aspect-ratio:1983/793;object-fit:cover;border-radius:var(--r);background:var(--sunk)}
@media (max-width:640px){ .banner{aspect-ratio:1.55/1} }
.infostrip{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:1rem 2rem;align-items:center;margin-top:1rem;padding:1rem 1.25rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.infostrip .item{display:flex;gap:.65rem;align-items:flex-start;min-width:0}
.infostrip .item svg{color:var(--gold);margin-top:.2rem}
.infostrip .k{display:block;font-size:.8rem;color:var(--muted)}
.infostrip .v{font-weight:600}
.open-now{display:inline-block;font-size:.78rem;font-weight:600;padding:.05rem .45rem;border-radius:3px;margin-left:.4rem;vertical-align:1px}
.open-now.yes{background:var(--ok-bg);color:var(--ok)}
.open-now.no{background:var(--sunk);color:var(--muted)}
.infostrip .acts{display:flex;gap:.5rem;flex-wrap:wrap}
@media (max-width:860px){ .infostrip{grid-template-columns:1fr} }

/* Sections */
.sec{padding-block:2.5rem}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.4rem 1.5rem;margin-bottom:1.25rem}
.sec-head h2{font-size:1.45rem}
.sec-head a{color:var(--gold);font-weight:600;text-underline-offset:3px}

/* Store directory */
.directory{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2rem 2.5rem}
@media (max-width:980px){ .directory{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:600px){ .directory{grid-template-columns:1fr;gap:1.75rem} }
.dept{border-top:2px solid var(--line-strong);padding-top:.8rem;min-width:0}
.dept-head{display:flex;align-items:center;gap:.6rem;text-decoration:none}
.dept-head svg{width:1.5rem;height:1.5rem;color:var(--gold);stroke-width:1.5}
.dept-head h3{font-size:1.15rem}
.dept-head .n{margin-left:auto;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.dept-head:hover h3{text-decoration:underline;text-underline-offset:3px}
.dept ul{list-style:none;margin:.7rem 0 0;padding:0;columns:2;column-gap:1.25rem;font-size:.93rem}
.dept li{break-inside:avoid;padding:.18rem 0}
.dept li a{text-decoration:none;color:var(--muted)}
.dept li a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.dept .all{display:inline-block;margin-top:.5rem;font-size:.9rem;font-weight:600;color:var(--gold);text-underline-offset:3px}
.dept .blurb{margin-top:.6rem;font-size:.93rem;color:var(--muted)}
@media (max-width:600px){ .dept li:nth-child(n+7){display:none} }

/* Product grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:1.75rem 1.1rem}
@media (max-width:420px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:1.4rem .75rem} }
.card{position:relative;min-width:0}
.card-hit{display:grid;gap:.55rem;width:100%;padding:0;border:0;background:none;text-align:left;cursor:pointer}
.media{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:var(--r);overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.card-hit:hover h3{text-decoration:underline;text-underline-offset:3px}
.ph{width:100%;height:100%;display:grid;place-items:center;align-content:center;gap:.5rem;color:var(--line);background:var(--surface)}
.ph svg{width:30%;height:auto;stroke-width:1;color:var(--muted);opacity:.45}
.ph span{font-size:.78rem;color:var(--muted);padding-inline:.5rem;text-align:center}
.tags{position:absolute;top:.45rem;left:.45rem;right:.45rem;display:flex;flex-wrap:wrap;gap:.3rem;pointer-events:none}
.tag{font-size:.72rem;font-weight:600;padding:.12rem .4rem;border-radius:3px;background:var(--sunk);color:var(--ink)}
.tag.gold{background:var(--gold-soft);color:var(--gold)}
.tag.out{background:var(--warn-bg);color:var(--warn)}
.card .brand{font-size:.78rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.card h3{font-weight:500;font-size:.98rem;line-height:1.3;overflow-wrap:anywhere}
.price{font-weight:700;font-variant-numeric:tabular-nums;margin-top:.15rem}
.price s{font-weight:400;color:var(--muted);margin-left:.35rem;font-size:.88em}
.price .off{color:var(--ok);font-weight:600;font-size:.82em;margin-left:.35rem}
.price.na{font-weight:500;color:var(--muted);font-size:.9rem}
.skel .media{background:var(--sunk);animation:pulse 1.4s ease-in-out infinite}
.skel .line{height:.8rem;border-radius:3px;background:var(--sunk);margin-top:.5rem}
@keyframes pulse{50%{opacity:.55}}

.notice{border:1px solid var(--line);border-radius:var(--r);padding:1.25rem;display:grid;gap:.6rem;justify-items:start;background:var(--surface)}
.notice h3{font-size:1.02rem}

/* Chips (brands, filters) */
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{display:inline-flex;align-items:center;gap:.4rem;min-height:36px;padding:0 .8rem;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:.92rem;text-decoration:none}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.85em}
.chip.on .n{color:inherit;opacity:.7}
.brandwall .chip{font-weight:600;min-height:42px;padding:0 1rem}

/* Page heads (department, visit, manage, search) */
.pagehead{background:var(--surface);border-bottom:1px solid var(--line)}
.pagehead .wrap{padding-block:1.6rem 1.4rem}
.pagehead h1{font-size:clamp(1.6rem,4vw,2.3rem);letter-spacing:-.02em}
.pagehead p{color:var(--muted);margin-top:.25rem}
.crumb{font-size:.88rem;color:var(--muted);margin-bottom:.4rem}
.crumb a{color:var(--muted)}

/* Subsection tabs on a department page */
.subnav{display:flex;gap:1.4rem;overflow-x:auto;scrollbar-width:thin;border-bottom:1px solid var(--line);margin-bottom:1.25rem}
.subnav .chip{white-space:nowrap;flex:none;border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:0;min-height:44px;margin-bottom:-1px;color:var(--muted)}
.subnav .chip:hover{color:var(--ink);border-color:transparent}
.subnav .chip.on{background:none;color:var(--ink);border-bottom-color:var(--gold-hi);font-weight:600}
.subnav .chip.on .n{opacity:1;color:var(--muted)}
.subnav .chip.zero{opacity:.65}
.toolbar{display:flex;flex-wrap:wrap;gap:.75rem 1rem;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
.toolbar .ctrls{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.sel{min-height:38px;padding:0 .6rem;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-width:100%}
.check{display:inline-flex;align-items:center;gap:.45rem;font-size:.93rem;cursor:pointer;min-height:38px}
.check input{width:1.05rem;height:1.05rem;accent-color:var(--gold)}
.count{font-size:.92rem;color:var(--muted);font-variant-numeric:tabular-nums}
.group + .group{margin-top:2.5rem}
.group-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.4rem 1rem;margin-bottom:1rem;padding-bottom:.5rem;border-bottom:1px solid var(--line)}
.group-head h2{font-size:1.2rem}
.group-head a{color:var(--gold);font-weight:600;font-size:.92rem;text-underline-offset:3px}

/* Search */
.searchbox{display:flex;align-items:center;gap:.6rem;border:1px solid var(--ink);border-radius:var(--r);padding:0 .9rem;background:var(--surface);min-height:50px;max-width:640px}
.searchbox input{flex:1;min-width:0;border:0;background:transparent;font-size:1.05rem;outline:none}

/* Visit */
.visit-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:1.5rem}
.visit-grid.one{grid-template-columns:minmax(0,1fr);max-width:720px}
@media (max-width:820px){ .visit-grid{grid-template-columns:1fr} }
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.4rem;display:grid;gap:1.1rem;align-content:start;min-width:0}
.panel h2{font-size:1.15rem}
.kv{display:grid;gap:.2rem}
.kv .k{font-size:.85rem;color:var(--muted)}
.copyrow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.copyrow .v{font-size:1.1rem;font-weight:600;font-variant-numeric:tabular-nums;user-select:all}
.pre{white-space:pre-line}
.vrow{display:grid;grid-template-columns:auto 1fr;gap:.25rem .75rem;align-items:start}
.vrow svg{color:var(--gold);margin-top:.2rem}
.hours{display:grid;grid-template-columns:auto 1fr;gap:.1rem .9rem;font-variant-numeric:tabular-nums}
.hours dt{color:var(--muted)}
.hours dd{margin:0}

/* Modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,#000 55%,transparent)}
.sheet{background:var(--surface);border-radius:6px;width:min(900px,100%);max-height:100%;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);position:relative}
.sheet .media{border-radius:0;border:0;aspect-ratio:1/1}
.sheet-body{padding:1.6rem;display:grid;gap:.8rem;align-content:start;min-width:0}
.sheet-body h2{font-size:1.45rem}
.sheet-body .brand{font-size:.8rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.sheet-body .price{font-size:1.3rem}
.ask{border-top:1px solid var(--line);padding-top:1rem;display:grid;gap:.6rem}
.ask h3{font-size:1rem}
.close{position:absolute;top:.6rem;right:.6rem;width:38px;height:38px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;z-index:2}
.pill{display:inline-flex;align-items:center;gap:.4rem;font-size:.85rem;font-weight:600;padding:.2rem .55rem;border-radius:3px;width:max-content}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.out{background:var(--warn-bg);color:var(--warn)}
@media (max-width:700px){ .sheet{grid-template-columns:1fr} .sheet .media{aspect-ratio:4/3} .sheet-body{padding:1.2rem} }

/* Manage */
.tabs{display:flex;gap:.4rem;margin-bottom:1.5rem;flex-wrap:wrap}
.manage-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:2rem;align-items:start}
@media (max-width:900px){ .manage-grid{grid-template-columns:1fr} }
.form{display:grid;gap:1rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media (max-width:420px){ .row2{grid-template-columns:1fr} }
.field{display:grid;gap:.35rem;min-width:0}
.field label,.field .lab{font-size:.9rem;font-weight:600}
.field .hint{font-size:.85rem;color:var(--muted)}
.in{width:100%;min-height:42px;padding:.5rem .7rem;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
textarea.in{min-height:92px;resize:vertical}
.in:focus{border-color:var(--ink);outline:none}
.photo{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.photo .media{width:96px;flex:none}
.photo-actions{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.toggles{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem}
.status{font-size:.92rem;min-height:1.4em}
.status.ok{color:var(--ok)}
.status.err{color:var(--warn)}
.plist{display:grid;gap:.5rem}
.prow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:.85rem;align-items:center;padding:.6rem;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.prow .media{width:56px}
.prow .ph svg{width:50%}
.prow .ph span{display:none}
.prow .t{font-weight:500;line-height:1.25;overflow-wrap:anywhere}
.prow .s{font-size:.85rem;color:var(--muted)}
.prow .acts{display:flex;gap:.35rem;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:520px){ .prow{grid-template-columns:48px minmax(0,1fr)} .prow .media{width:48px} .prow .acts{grid-column:1/-1;justify-content:flex-start} }
.listbar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:.9rem}
.listbar .in{min-height:38px;flex:1;min-width:10rem}
.subs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:1.25rem;align-items:start}
@media (max-width:420px){ .subs-grid{grid-template-columns:1fr} }
.subs-grid h2{display:flex;align-items:center;gap:.5rem}
.subs-grid h2 svg{color:var(--gold)}
.slist{list-style:none;margin:0;padding:0;display:grid;border-top:1px solid var(--line)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.5rem;align-items:center;padding:.45rem 0;border-bottom:1px solid var(--line)}
.srow .sn{font-weight:500;overflow-wrap:anywhere}
.srow .sc{display:block;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:400}
.sacts{display:flex;gap:.25rem;flex-wrap:wrap;justify-content:flex-end}
.ibtn{min-width:34px;height:34px;padding:0 .55rem;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.85rem;font-weight:600}
.ibtn:hover:not([disabled]){border-color:var(--ink)}
.ibtn[disabled]{opacity:.35;cursor:default}
.ibtn.danger{background:var(--warn);border-color:var(--warn);color:var(--bg)}
.srow .in{min-height:36px;padding:.3rem .6rem}
.sadd{display:flex;gap:.5rem}
.sadd .in{min-height:38px;flex:1;min-width:0}
.swarn{grid-column:1/-1;font-size:.85rem;color:var(--warn)}

/* Footer */
.foot{background:var(--panel);color:var(--on-panel)}
.foot .wrap{padding-block:2.25rem 2rem;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:2rem}
.foot .logo{color:var(--on-panel)}
.foot .logo .l2{color:var(--gold-hi)}
.foot h3{font-size:.95rem;margin-bottom:.6rem}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:.3rem}
.foot a{text-decoration:none;color:var(--on-panel-muted)}
.foot a:hover{color:var(--on-panel);text-decoration:underline}
.foot .small{color:var(--on-panel-muted);font-size:.9rem}
@media (max-width:760px){ .foot .wrap{grid-template-columns:1fr} }

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:var(--r);font-size:.92rem;z-index:60;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>

</head>
<body>
<div class="announce" id="announce" hidden><div class="wrap" id="announce-text"></div></div>

<header class="site-header">
  <div class="wrap bar">
    <a class="logo" href="#" aria-label="Multi Brand Horizon home"><span class="l1">Multi Brand</span><span class="l2">Horizon</span></a>
    <form class="hsearch" id="hsearch" role="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><input id="hq" type="search" placeholder="Search for jeans, headphones, bottles…" aria-label="Search products" autocomplete="off"></form>
    <nav class="nav" aria-label="Main">
      <a href="#search" data-nav="search" class="only-sm" aria-label="Search products"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></a>
      <a href="#visit" data-nav="visit"><svg class="i" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg><span class="lbl">Visit us</span></a>
    </nav>
  </div>
  <nav class="catrail" aria-label="Departments"><div class="wrap" id="catrail"></div></nav>
</header>

<main>
  <!-- HOME -->
  <div data-view="home">
    <section class="home-top">
      <div class="wrap">
        <img class="banner" src="banner.jpg" width="1983" height="793" alt="Multi Brand Horizon. All top brands: fashion, electronics, home and living, gifts and accessories, sports and fitness, and more. All kind of things under one roof.">
        <div class="infostrip" id="infostrip"></div>
      </div>
    </section>

    <section class="sec">
      <div class="wrap">
        <div class="sec-head"><h2>Shop by department</h2></div>
        <div class="directory" id="directory"></div>
      </div>
    </section>

    <section class="sec" id="sec-new">
      <div class="wrap">
        <div class="sec-head"><h2>New arrivals</h2><a href="#search">View all products</a></div>
        <div id="home-new"></div>
      </div>
    </section>

    <section class="sec" id="sec-brands">
      <div class="wrap">
        <div class="sec-head"><h2>Brands in store</h2></div>
        <div class="chips brandwall" id="brandwall"></div>
      </div>
    </section>
  </div>

  <!-- CATEGORY -->
  <div data-view="category" hidden>
    <section class="pagehead"><div class="wrap" id="cat-head"></div></section>
    <section class="sec">
      <div class="wrap">
        <nav class="subnav" id="cat-sections" aria-label="Subsections"></nav>
        <div class="toolbar">
          <span class="count" id="cat-count"></span>
          <div class="ctrls">
            <label class="check"><input type="checkbox" id="cat-stock"> In stock only</label>
            <select class="sel" id="cat-brand" aria-label="Filter by brand"></select>
            <select class="sel" id="cat-sort" aria-label="Sort products">
              <option value="new">Newest first</option>
              <option value="low">Price: low to high</option>
              <option value="high">Price: high to low</option>
              <option value="az">Name: A to Z</option>
            </select>
          </div>
        </div>
        <div id="cat-grid"></div>
      </div>
    </section>
  </div>

  <!-- SEARCH -->
  <div data-view="search" hidden>
    <section class="pagehead"><div class="wrap"><p class="crumb"><a href="#">Home</a> / Search</p><h1>Search products</h1></div></section>
    <section class="sec">
      <div class="wrap">
        <label class="searchbox" for="q"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><input id="q" type="search" placeholder="Search products, brands or types" autocomplete="off"></label>
        <div class="chips" id="search-brand" style="margin-top:1rem"></div>
        <p class="count" id="search-count" style="margin:1.25rem 0 1rem"></p>
        <div id="search-grid"></div>
      </div>
    </section>
  </div>

  <!-- VISIT -->
  <div data-view="visit" hidden>
    <section class="pagehead"><div class="wrap"><p class="crumb"><a href="#">Home</a> / Visit us</p><h1>Visit us</h1><p id="visit-sub"></p></div></section>
    <section class="sec"><div class="wrap" id="visit-body"></div></section>
  </div>

</main>

<footer class="foot">
  <div class="wrap">
    <div>
      <a class="logo" href="#"><span class="l1">Multi Brand</span><span class="l2">Horizon</span></a>
      <p class="small pre" id="foot-addr" style="margin-top:1rem"></p>
      <p class="small" id="foot-hours" style="margin-top:.4rem"></p>
    </div>
    <div><h3>Departments</h3><ul id="foot-cats"></ul></div>
    <div><h3>Store</h3><ul>
      <li><a href="#visit">Visit us</a></li>
      <li><a href="#search">Search products</a></li>
    </ul><p class="small" style="margin-top:1rem">© <span id="yr"></span> Multi Brand Horizon</p></div>
  </div>
</footer>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-label="Product details">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
const ICON = {
  hanger:'<path d="M12 7.2a2.1 2.1 0 1 1 2.1-2.1"/><path d="M12 7.2v1.3L3.2 15a1.2 1.2 0 0 0 .7 2.2h16.2a1.2 1.2 0 0 0 .7-2.2L12 8.5"/>',
  laptop:'<rect x="4.5" y="5" width="15" height="10.5" rx="1.2"/><path d="M2.5 18.5h19"/>',
  house:'<path d="M3.5 11 12 4.2l8.5 6.8"/><path d="M5.8 9.4V20h12.4V9.4"/><path d="M10 20v-5.2h4V20"/>',
  gift:'<rect x="3.5" y="8.2" width="17" height="3.8"/><path d="M5.2 12v8.5h13.6V12M12 8.2v12.3"/><path d="M12 8.2C10.6 5 7.4 4.6 7.4 6.6c0 1.3 2 1.6 4.6 1.6zM12 8.2c1.4-3.2 4.6-3.6 4.6-1.6 0 1.3-2 1.6-4.6 1.6z"/>',
  dumbbell:'<path d="M7 7.5v9M4.5 9.5v5M17 7.5v9M19.5 9.5v5M7 12h10M2.5 12h2M19.5 12h2"/>',
  dots:'<circle cx="12" cy="12" r="8.5"/><path d="M8 12h.01M12 12h.01M16 12h.01" stroke-width="2.4"/>',
  close:'<path d="M6 6l12 12M18 6 6 18"/>',
  pin:'<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  phone:'<path d="M5 4h3.5l1.6 4-2.2 1.4a10 10 0 0 0 4.7 4.7l1.4-2.2 4 1.6V17a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
};
const ic = (n, cls='i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

const CATS = [
  {id:'fashion', name:'Fashion', icon:'hanger', blurb:'Clothing, footwear and bags for men, women and kids.'},
  {id:'electronics', name:'Electronics', icon:'laptop', blurb:'Audio, gadgets, chargers and smart devices.'},
  {id:'home-living', name:'Home & Living', icon:'house', blurb:'Décor, kitchen, bedding and daily essentials.'},
  {id:'gifts', name:'Gifts & Accessories', icon:'gift', blurb:'Watches, wallets, fragrances and gift sets.'},
  {id:'sports', name:'Sports & Fitness', icon:'dumbbell', blurb:'Gym gear, sportswear, bottles and outdoor kit.'},
  {id:'more', name:'More', icon:'dots', blurb:'Stationery, toys, travel and personal care.'},
];
const catOf = id => CATS.find(c => c.id === id) || CATS[5];
const EG = {fashion:'Kurtas', electronics:'Drones', 'home-living':'Curtains', gifts:'Pens', sports:'Swimming', more:'Pet Supplies'};
const slug = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/&/g,' and ').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'section';
const secsOf = id => state.depts[id] || [];

const state = {
  view:'home', curCat:null, products:[], loaded:false, slow:false, error:null, dbOk:null,
  store:{}, canEdit:false, depts:{}, deptsLoaded:false,
  cat:{slug:'', brand:'all', sort:'new', stock:false},
  subAdd:{}, subMsg:{}, renaming:null, renameVal:'', confirmSub:null, subBusy:false,
  search:{q:'', brand:''},
  manageTab:'products', mq:'', mcat:'all', confirmDel:null, confirmSamples:false,
  editingId:null, form:{imageId:null, originalImageId:null, pending:[]}, storeDirty:false,
};

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => (v === null || v === undefined || v === '' || isNaN(Number(v))) ? null : Number(v);
function money(n){
  if (num(n) === null) return '';
  const cur = (state.store.currency || '₹').trim();
  return cur + Number(n).toLocaleString(cur === '₹' ? 'en-IN' : 'en-US', {maximumFractionDigits:2});
}
function priceHTML(p){
  const price = num(p.price), mrp = num(p.mrp);
  if (price === null) return `<p class="price na">Price in store</p>`;
  let s = `<p class="price">${esc(money(price))}`;
  if (mrp !== null && mrp > price) s += `<s>${esc(money(mrp))}</s><span class="off">${Math.round((1 - price/mrp)*100)}% off</span>`;
  return s + '</p>';
}
function mediaHTML(p, label=true){
  const c = catOf(p.category);
  const ph = `<div class="ph">${ic(c.icon)}${label ? `<span>${esc(p.brand || c.name)}</span>` : ''}</div>`;
  const img = String(p.image || '').trim();
  if (img && !img.includes('..') && (/^https:\/\//i.test(img) || /^[\w\-./ ]+$/.test(img))) return `<img src="${esc(encodeURI(img))}" alt="${esc(p.name)}" loading="lazy" data-fallback="${esc(c.icon)}">`;
  return ph;
}
function wireImages(root){
  root.querySelectorAll('img[data-fallback]').forEach(img => img.addEventListener('error', () => {
    img.outerHTML = `<div class="ph">${ic(img.dataset.fallback)}</div>`;
  }, {once:true}));
}
const sortNew = (a,b) => (b.createdAt||0) - (a.createdAt||0);

function cardHTML(p){
  const tags = [];
  if (p.sample) tags.push('<span class="tag">Sample</span>');
  if (p.inStock === false) tags.push('<span class="tag out">Sold out</span>');
  else if (p.featured) tags.push('<span class="tag gold">Featured</span>');
  return `<article class="card"><button class="card-hit" data-product="${esc(p.id)}" aria-label="${esc((p.brand ? p.brand + ' ' : '') + p.name)}">
    <div class="media">${mediaHTML(p)}<div class="tags">${tags.join('')}</div></div>
    <div><p class="brand">${esc(p.brand || ' ')}</p><h3>${esc(p.name)}</h3>${priceHTML(p)}</div>
  </button></article>`;
}

function gridOrState(list, emptyHTML){
  const pre = loadState(); if (pre) return pre;
  if (!list.length) return emptyHTML;
  return `<div class="grid">${list.map(cardHTML).join('')}</div>`;
}
function loadState(){
  if (state.dbOk === false) return `<div class="notice"><h3>Products can't be shown in this view</h3><p class="muted">Open this page while signed in to see what's on our shelves, or visit the store.</p><a class="btn small" href="#visit">Store details</a></div>`;
  if (state.error) return `<div class="notice"><h3>Couldn't load products</h3><p class="muted">Reload the page, or visit the store.</p></div>`;
  if (!state.loaded){
    const sk = Array.from({length:4}, () => `<div class="card skel"><div class="media"></div><div class="line" style="width:40%"></div><div class="line" style="width:80%"></div></div>`).join('');
    return (state.slow ? `<p class="muted" style="margin-bottom:1rem">Still loading products. Check your connection.</p>` : '') + `<div class="grid" aria-busy="true">${sk}</div>`;
  }
  return '';
}
function emptyCat(catName, sec){
  return `<div class="notice"><h3>Nothing listed in ${esc(sec || catName)} yet</h3><p class="muted">We may still have it in the shop. ${canCall() ? 'Call us or drop in to ask.' : 'Drop in and ask.'}</p>${state.canEdit ? `<a class="btn small" href="#manage" data-addcat="${esc(state.curCat||'')}" data-addsec="${esc(sec||'')}">Add a product</a>` : ''}</div>`;
}

/* ---------- Store info bits ---------- */
function hoursHTML(text){
  const lines = String(text||'').split('\n').map(s => s.trim()).filter(Boolean);
  if (!lines.length) return '';
  return `<dl class="hours">${lines.map(l => { const i = l.indexOf(':'); if (i > 0 && i < l.length-1 && !/^\d/.test(l)) return `<dt>${esc(l.slice(0,i))}</dt><dd>${esc(l.slice(i+1).trim())}</dd>`; return `<dd style="grid-column:1/-1">${esc(l)}</dd>`; }).join('')}</dl>`;
}
const safeUrl = u => /^https:\/\//i.test(String(u||'').trim()) ? String(u).trim() : '';
const waDigits = () => String(state.store.whatsapp||'').replace(/\D/g,'');
const canCall = () => !!(String(state.store.phone||'').trim() || waDigits());
function hasStoreInfo(){ const s = state.store; return !!(s.address || s.hours || s.phone || s.whatsapp || s.email); }

// "Open now" only when hours are one line covering every day, e.g. "Monday to Sunday: 10:00 am – 7:00 pm"
function openStatus(){
  const lines = String(state.store.hours||'').split('\n').map(l => l.trim()).filter(Boolean);
  if (lines.length !== 1 || !/daily|every ?day|all days|mon\w*\s*(to|-|–)\s*sun/i.test(lines[0])) return null;
  const m = [...lines[0].matchAll(/(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)/gi)];
  if (m.length !== 2) return null;
  const mins = x => ((+x[1] % 12) + (x[3].toLowerCase() === 'pm' ? 12 : 0)) * 60 + (+(x[2] || 0));
  const say = x => `${+x[1]}${x[2] && x[2] !== '00' ? ':' + x[2] : ''} ${x[3].toLowerCase()}`;
  let now;
  try {
    const parts = new Intl.DateTimeFormat('en-GB', {timeZone:'Asia/Kolkata', hour:'2-digit', minute:'2-digit', hourCycle:'h23'}).formatToParts(new Date());
    now = (+parts.find(x => x.type === 'hour').value) * 60 + (+parts.find(x => x.type === 'minute').value);
  } catch { return null; }
  return now >= mins(m[0]) && now < mins(m[1]) ? {open:true, text:`Open now, closes ${say(m[1])}`} : {open:false, text:`Closed now, opens ${say(m[0])}`};
}
const oneLine = t => String(t||'').split('\n').map(x => x.trim()).filter(Boolean).join(', ');

function renderInfoStrip(){
  const s = state.store, el = $('#infostrip');
  if (!hasStoreInfo()){
    el.hidden = !state.canEdit;
    el.innerHTML = `<p class="muted">Add your address and opening hours so customers can find you.</p><span></span><div class="acts"><a class="btn small" href="#manage" data-tab="store">Add store details</a></div>`;
    return;
  }
  el.hidden = false;
  const st = openStatus(), map = safeUrl(s.mapUrl);
  el.innerHTML = `
    <div class="item">${ic('pin')}<div><span class="k">Address</span><span class="v">${esc(oneLine(s.address)) || '—'}</span></div></div>
    <div class="item">${ic('clock')}<div><span class="k">Opening hours${st ? `<span class="open-now ${st.open ? 'yes' : 'no'}">${st.text}</span>` : ''}</span><span class="v">${esc(oneLine(s.hours)) || '—'}</span>${s.phone ? `<span class="k" style="margin-top:.2rem">Phone ${esc(s.phone)}</span>` : ''}</div></div>
    <div class="acts">${map ? `<a class="btn small" href="${esc(map)}" target="_blank" rel="noopener">Get directions</a>` : ''}${canCall() ? '<a class="btn ghost small" href="#visit">Contact</a>' : ''}</div>`;
}

function renderVisit(){
  const s = state.store, map = safeUrl(s.mapUrl), wa = waDigits();
  if (!hasStoreInfo()){
    $('#visit-body').innerHTML = state.canEdit
      ? `<div class="notice"><h3>Your store details are empty</h3><p class="muted">Add your address, hours and contact numbers in Manage store. They appear here, on the home page and on every product.</p><a class="btn small" href="#manage" data-tab="store">Add store details</a></div>`
      : `<div class="notice"><h3>Store details coming soon</h3><p class="muted">We're adding our address and opening hours. Check back shortly.</p></div>`;
    return;
  }
  let left = `<div class="panel"><h2>Find us</h2>`;
  if (s.address) left += `<div class="kv"><span class="k">Address</span><p class="pre" style="font-size:1.1rem">${esc(s.address)}</p></div>`;
  if (s.parking) left += `<div class="kv"><span class="k">Landmarks and parking</span><p>${esc(s.parking)}</p></div>`;
  if (map) left += `<div><a class="btn" href="${esc(map)}" target="_blank" rel="noopener">${ic('pin')} Open in Google Maps</a></div>`;
  if (s.hours) left += `<div class="kv"><span class="k">Opening hours</span>${hoursHTML(s.hours)}</div>`;
  left += `</div>`;
  if (!(s.phone || wa || s.email)){ $('#visit-body').innerHTML = `<div class="visit-grid one">${left}</div>`; return; }
  let right = `<div class="panel"><h2>Ask before you visit</h2><p class="muted">Want to check something is in stock, or ask us to keep it aside? Get in touch.</p>`;
  if (s.phone) right += `<div class="kv"><span class="k">Phone</span><div class="copyrow"><span class="v">${esc(s.phone)}</span><button class="btn ghost small" data-copy="${esc(s.phone)}">Copy</button></div></div>`;
  if (wa) right += `<div class="kv"><span class="k">WhatsApp</span><div class="copyrow"><span class="v">${esc(s.whatsapp)}</span><a class="btn small" href="https://wa.me/${wa}" target="_blank" rel="noopener">Message us</a></div></div>`;
  if (s.email) right += `<div class="kv"><span class="k">Email</span><div class="copyrow"><span class="v" style="font-size:1rem;overflow-wrap:anywhere">${esc(s.email)}</span><button class="btn ghost small" data-copy="${esc(s.email)}">Copy</button></div></div>`;
  right += `</div>`;
  $('#visit-body').innerHTML = `<div class="visit-grid">${left}${right}</div>`;
}

/* ---------- Views ---------- */
function renderChrome(){
  const counts = {}; state.products.forEach(p => counts[p.category] = (counts[p.category]||0) + 1);
  $('#catrail').innerHTML = CATS.map(c => `<a href="#${c.id}" class="${state.view==='category' && state.curCat===c.id ? 'on' : ''}">${c.name}</a>`).join('');
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === state.view));
  const ann = (state.store.announcement||'').trim();
  $('#announce').hidden = !ann; $('#announce-text').textContent = ann;
  $('#foot-addr').textContent = state.store.address || '';
  $('#foot-hours').textContent = oneLine(state.store.hours);
  $('#visit-sub').textContent = oneLine(state.store.address);
}

function renderHome(){
  renderInfoStrip();
  const counts = {}; state.products.forEach(p => counts[p.category] = (counts[p.category]||0) + 1);
  $('#directory').innerHTML = CATS.map(c => {
    const secs = secsOf(c.id), n = counts[c.id] || 0;
    return `<div class="dept"><a class="dept-head" href="#${c.id}">${ic(c.icon)}<h3>${c.name}</h3>${state.loaded && n ? `<span class="n">${n} ${n === 1 ? 'product' : 'products'}</span>` : ''}</a>${secs.length
      ? `<ul>${secs.map(s => `<li><a href="#${c.id}--${slug(s)}">${esc(s)}</a></li>`).join('')}</ul><a class="all" href="#${c.id}">See all in ${c.name}</a>`
      : `<p class="blurb">${c.blurb}</p>`}</div>`;
  }).join('');
  const list = [...state.products].sort((a,b) => (!!b.featured - !!a.featured) || sortNew(a,b)).slice(0, 8);
  $('#home-new').innerHTML = gridOrState(list, `<div class="notice"><h3>No products listed yet</h3><p class="muted">New products will show up here as they're added.</p>${state.canEdit ? '<a class="btn small" href="#manage">Add your first product</a>' : ''}</div>`);
  wireImages($('#home-new'));
  const brands = brandCounts(state.products);
  $('#brandwall').innerHTML = brands.map(([b,n]) => `<button class="chip" data-brand="${esc(b)}">${esc(b)} <span class="n">${n}</span></button>`).join('');
  // Until real products are listed, leave these sections out rather than show empty shelves
  $('#sec-brands').hidden = !brands.length;
  $('#sec-new').hidden = state.loaded && !state.error && !state.products.length;
}
function brandCounts(list){
  const m = new Map();
  list.forEach(p => { const b = (p.brand||'').trim(); if (b) m.set(b, (m.get(b)||0) + 1); });
  return [...m.entries()].sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0]));
}

function renderCategory(){
  const c = catOf(state.curCat), f = state.cat;
  const secs = secsOf(c.id);
  const secOf = p => { const s = (p.section||'').trim(); return secs.includes(s) ? s : ''; };
  const items = state.products.filter(p => p.category === c.id);
  const hasOther = items.some(p => !secOf(p));
  // '' = whole department, '__other' = products without a listed subsection
  let sel = '';
  if (f.slug === 'other' && hasOther) sel = '__other';
  else if (f.slug) sel = secs.find(s => slug(s) === f.slug) || '';
  const selName = sel === '__other' ? 'Everything else' : sel;
  $('#cat-head').innerHTML = `<p class="crumb"><a href="#">Home</a> / ${sel ? `<a href="#${c.id}">${c.name}</a> / ${esc(selName)}` : c.name}</p><h1>${sel ? esc(selName) : c.name}</h1>${sel ? '' : `<p>${c.blurb}</p>`}`;

  const inSec = s => items.filter(p => s === '__other' ? !secOf(p) : secOf(p) === s).length;
  const chip = (href, label, n, on) => `<a class="chip ${on ? 'on' : ''} ${state.loaded && !n ? 'zero' : ''}" href="#${href}" ${on ? 'aria-current="page"' : ''}>${label}${state.loaded ? ` <span class="n">${n}</span>` : ''}</a>`;
  $('#cat-sections').innerHTML = (secs.length || hasOther)
    ? chip(c.id, 'All', items.length, !sel) + secs.map(s => chip(`${c.id}--${slug(s)}`, esc(s), inSec(s), sel === s)).join('') + (hasOther && secs.length ? chip(`${c.id}--other`, 'Everything else', inSec('__other'), sel === '__other') : '')
    : '';

  const scope = sel ? items.filter(p => sel === '__other' ? !secOf(p) : secOf(p) === sel) : items;
  const brands = brandCounts(scope).map(x => x[0]);
  if (f.brand !== 'all' && !brands.includes(f.brand)) f.brand = 'all';
  $('#cat-brand').innerHTML = `<option value="all">All brands</option>` + brands.map(b => `<option value="${esc(b)}">${esc(b)}</option>`).join('');
  $('#cat-brand').value = f.brand; $('#cat-sort').value = f.sort; $('#cat-stock').checked = f.stock;
  const list = sortList(scope.filter(p => (f.brand==='all' || (p.brand||'').trim()===f.brand) && (!f.stock || p.inStock !== false)), f.sort);
  $('#cat-count').textContent = state.loaded ? `${list.length} ${list.length===1?'product':'products'}` : '';
  const noMatch = `<div class="notice"><h3>Nothing matches these filters</h3><button class="linkbtn" data-clearcat>Clear filters</button></div>`;
  const grid = $('#cat-grid');
  const pre = loadState();
  if (pre) grid.innerHTML = pre;
  else if (!scope.length) grid.innerHTML = emptyCat(c.name, sel && sel !== '__other' ? sel : '');
  else if (!list.length) grid.innerHTML = noMatch;
  else if (sel || !secs.length) grid.innerHTML = `<div class="grid">${list.map(cardHTML).join('')}</div>`;
  else {
    // Whole department: one shelf per subsection that has products
    const MAX = 8;
    grid.innerHTML = [...secs, '__other'].map(s => {
      const g = list.filter(p => s === '__other' ? !secOf(p) : secOf(p) === s);
      if (!g.length) return '';
      const title = s === '__other' ? 'Everything else' : s;
      return `<section class="group"><div class="group-head"><h2>${esc(title)}</h2><a href="#${c.id}--${s === '__other' ? 'other' : slug(s)}">View all${g.length > 1 ? ' ' + g.length : ''}</a></div><div class="grid">${g.slice(0, MAX).map(cardHTML).join('')}</div></section>`;
    }).join('');
  }
  wireImages(grid);
}
function sortList(list, how){
  const pr = p => num(p.price);
  const l = [...list];
  if (how === 'low') l.sort((a,b) => (pr(a) ?? Infinity) - (pr(b) ?? Infinity));
  else if (how === 'high') l.sort((a,b) => (pr(b) ?? -Infinity) - (pr(a) ?? -Infinity));
  else if (how === 'az') l.sort((a,b) => String(a.name).localeCompare(String(b.name)));
  else l.sort(sortNew);
  return l;
}

function renderSearch(){
  const {q, brand} = state.search;
  $('#search-brand').innerHTML = brand ? `<button class="chip on" data-clearbrand>Brand: ${esc(brand)} <span class="n">✕</span></button>` : '';
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  let list = state.products.filter(p => {
    if (brand && (p.brand||'').trim() !== brand) return false;
    const hay = [p.name, p.brand, p.section, p.description, catOf(p.category).name].join(' ').toLowerCase();
    return words.every(w => hay.includes(w));
  }).sort(sortNew);
  $('#search-count').textContent = state.loaded ? (q || brand ? `${list.length} ${list.length===1?'result':'results'}` : `All ${list.length} products`) : '';
  $('#search-grid').innerHTML = gridOrState(list, `<div class="notice"><h3>No matches${q ? ` for “${esc(q)}”` : ''}</h3><p class="muted">Try a different word, or ask us in store. Not everything we sell is listed online.</p></div>`);
  wireImages($('#search-grid'));
}

/* ---------- Product modal ---------- */
let lastFocus = null;
function openProduct(id){
  const p = state.products.find(x => x.id === id); if (!p) return;
  const c = catOf(p.category), s = state.store, wa = waDigits();
  let ask = '';
  if (s.phone || wa){
    ask = `<div class="ask"><h3>Ask about this item</h3><p class="muted" style="font-size:.92rem">Call or message us to check sizes, colours or to keep it aside.</p>`;
    if (s.phone) ask += `<div class="copyrow"><span class="v">${esc(s.phone)}</span><button class="btn ghost small" data-copy="${esc(s.phone)}">Copy number</button></div>`;
    if (wa) ask += `<div><a class="btn small" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${encodeURIComponent(`Hi! Is "${p.name}"${p.brand ? ' by ' + p.brand : ''} available at Multi Brand Horizon?`)}">Ask on WhatsApp</a></div>`;
    ask += `</div>`;
  } else {
    ask = `<div class="ask"><h3>See it in store</h3><p class="muted" style="font-size:.92rem">Visit Multi Brand Horizon to see and try this item.</p><a class="linkbtn" href="#visit" data-closego>Store details</a></div>`;
  }
  $('#sheet').innerHTML = `<button class="close" data-close aria-label="Close">${ic('close')}</button>
    <div class="media">${mediaHTML(p)}</div>
    <div class="sheet-body">
      <p class="crumb"><a href="#${c.id}" data-closego>${c.name}</a>${p.section ? ' / ' + (secsOf(c.id).includes(p.section) ? `<a href="#${c.id}--${slug(p.section)}" data-closego>${esc(p.section)}</a>` : esc(p.section)) : ''}</p>
      ${p.brand ? `<p class="brand">${esc(p.brand)}</p>` : ''}
      <h2>${esc(p.name)}</h2>
      ${priceHTML(p)}
      ${p.inStock === false ? `<span class="pill out">Sold out right now</span>` : `<span class="pill ok">In stock</span>${canCall() ? '<p class="muted" style="font-size:.9rem">Stock changes quickly. Call or message us to check before you visit.</p>' : ''}`}
      ${p.sample ? `<p class="muted" style="font-size:.88rem">This is a sample listing.</p>` : ''}
      ${p.description ? `<p class="pre">${esc(p.description)}</p>` : ''}
      ${ask}
      ${state.canEdit ? `<div><button class="linkbtn" data-edit="${esc(p.id)}">Edit this product</button></div>` : ''}
    </div>`;
  wireImages($('#sheet'));
  lastFocus = document.activeElement;
  $('#modal').hidden = false; document.body.style.overflow = 'hidden';
  $('#sheet .close').focus();
}
function closeModal(){
  if ($('#modal').hidden) return;
  $('#modal').hidden = true; document.body.style.overflow = '';
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}

let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }
async function copyText(text, btn){
  try { await navigator.clipboard.writeText(text); toast('Copied'); }
  catch {
    const v = btn.parentElement.querySelector('.v');
    if (v){ const r = document.createRange(); r.selectNodeContents(v); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selected. Copy it from here.'); }
  }
}

/* ---------- Routing + render ---------- */
function render(){
  renderChrome();
  if (state.view === 'home') renderHome();
  else if (state.view === 'category') renderCategory();
  else if (state.view === 'search') renderSearch();
  else if (state.view === 'visit') renderVisit();
}
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  let v = 'home';
  const [hc, hs = ''] = h.split('--');
  if (CATS.some(c => c.id === hc)){
    v = 'category';
    if (state.curCat !== hc){ state.curCat = hc; state.cat = {slug:'', brand:'all', sort:'new', stock:false}; }
    if (state.cat.slug !== hs){ state.cat.slug = hs; state.cat.brand = 'all'; }
  }
  else if (['visit','search'].includes(h)) v = h;
  const changed = v !== state.view || v === 'category';
  state.view = v;
  document.querySelectorAll('[data-view]').forEach(s => s.hidden = s.dataset.view !== v);
  closeModal();
  render();
  if (changed) window.scrollTo(0, 0);
  if (v === 'search') { $('#q').value = state.search.q; }
}
window.addEventListener('hashchange', route);

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button, a'); if (!t) return;
  const d = t.dataset;
  if (d.product){ openProduct(d.product); return; }
  if ('close' in d || 'closego' in d){ closeModal(); return; }
  if (d.copy){ copyText(d.copy, t); return; }
  if (d.brand){ state.search = {q:'', brand:d.brand}; location.hash = 'search'; if (state.view==='search') render(); return; }
  if ('clearbrand' in d){ state.search.brand = ''; render(); return; }
  if ('clearcat' in d){ state.cat.brand = 'all'; state.cat.stock = false; render(); return; }
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

$('#cat-brand').addEventListener('change', e => { state.cat.brand = e.target.value; render(); });
$('#cat-sort').addEventListener('change', e => { state.cat.sort = e.target.value; render(); });
$('#cat-stock').addEventListener('change', e => { state.cat.stock = e.target.checked; render(); });
$('#q').addEventListener('input', e => { state.search.q = e.target.value; renderSearch(); });
$('#hsearch').addEventListener('submit', e => {
  e.preventDefault();
  state.search = {q: $('#hq').value.trim(), brand:''};
  if (location.hash === '#search'){ $('#q').value = state.search.q; render(); } else location.hash = 'search';
});
$('#foot-cats').innerHTML = CATS.map(c => `<li><a href="#${c.id}">${c.name}</a></li>`).join('');
$('#yr').textContent = new Date().getFullYear();
route();

/* ---------- Data: everything comes from data/catalog.json ---------- */
(async () => {
  try {
    const r = await fetch('data/catalog.json', {cache:'no-cache'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    state.store = data.store || {};
    state.depts = {};
    for (const [k, v] of Object.entries(data.departments || {})) if (Array.isArray(v)) state.depts[k] = v.filter(x => typeof x === 'string' && x.trim());
    state.products = (Array.isArray(data.products) ? data.products : [])
      .filter(p => p && p.name)
      .map((p, i) => ({...p, id: String(p.id || slug(p.name) + '-' + i), createdAt: Date.parse(p.added || '') || 0}));
    state.loaded = true;
  } catch (err) { console.error('Could not load catalog', err); state.error = 'load'; }
  render();
})();
</script>

</body>
</html>
